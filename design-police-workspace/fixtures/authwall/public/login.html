<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Orbit</title>

<style>
  :root {
    --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --ink: #15171c; --ink-2: #3e4552; --accent: #1a44d6; --rule: #dee2ea;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, -apple-system, sans-serif; font-size: 16px;
    line-height: 1.6; color: var(--ink); background: #f6f7fa;
  }
  .card {
    width: 100%; max-width: 400px; margin: var(--s5);
    background: #fff; border: 1px solid var(--rule);
    border-radius: var(--radius); padding: var(--s6);
  }
  h1 { font-size: 25px; line-height: 1.25; margin: 0 0 var(--s2); }
  p { color: var(--ink-2); margin: 0 0 var(--s5); max-width: 46ch; }
  label { display: block; font-size: 16px; margin-bottom: var(--s2); }
  input {
    width: 100%; font: inherit; padding: var(--s3) var(--s4);
    border: 1px solid var(--rule); border-radius: var(--radius);
    margin-bottom: var(--s4);
  }
  button {
    width: 100%; font: inherit; font-weight: 500; cursor: pointer;
    background: var(--accent); color: #fff; border: 0;
    border-radius: var(--radius); padding: var(--s3) var(--s5);
    transition: background-color 0.15s ease;
  }
  button:hover { background: #143aba; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

<main class="card">
  <h1>Sign in to Orbit</h1>
  <p>We'll email you a link that signs you in. No password to remember.</p>
  <form method="post" action="/login">
    <label for="email">Work email</label>
    <input id="email" name="email" type="email" required autocomplete="email"
           placeholder="you@company.com">
    <button type="submit">Email me a link</button>
  </form>
</main>
</html>
